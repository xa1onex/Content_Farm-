name: Content farm regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m pip install aiogram python-dotenv google-api-python-client google-auth-httplib2 google-auth-oauthlib Pillow
      - run: python -m unittest discover -s tests -p test_regressions.py -q
        working-directory: content_farm
