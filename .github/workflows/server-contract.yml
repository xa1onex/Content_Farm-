name: Server and Worker contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shortpost_test
          POSTGRES_PASSWORD: test_only_ephemeral
          POSTGRES_DB: shortpost_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shortpost_test -d shortpost_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://shortpost_test:test_only_ephemeral@127.0.0.1:5432/shortpost_test
      SHORTPOST_INTEGRATION_DATABASE_URL: postgresql+psycopg://shortpost_test:test_only_ephemeral@127.0.0.1:5432/shortpost_test
      ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.lock -e "./worker[test]"
      - run: python -m alembic upgrade head
        working-directory: server
      - run: python -m pytest -q
        working-directory: server
      - run: python -m pytest -q tests/test_real_server.py --junitxml=contract-results.xml
        working-directory: worker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-worker-contract
          path: worker/contract-results.xml
