[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "shortpost-worker"
version = "0.1.0"
description = "Durable Windows/MuMu executor for the existing ShortPost API"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<0.29", "pydantic>=2.10,<3", "Appium-Python-Client>=5,<6", "psutil>=6,<8", "portalocker>=3,<4"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "cryptography>=43"]
[project.scripts]
shortpost-worker = "shortpost_worker.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
