# Isolated TLS listener. Existing server blocks are left untouched.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name origin.xdoublegroup.online;
    ssl_certificate /etc/letsencrypt/live/origin.xdoublegroup.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/origin.xdoublegroup.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:8108;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Media-Ticket $http_x_media_ticket;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
